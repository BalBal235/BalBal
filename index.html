<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BalBal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
    }

    header p {
      margin-top: 8px;
      color: #ccc;
    }

    .hero {
      padding: 60px 20px;
      text-align: center;
      background: white;
    }

    .hero h2 {
      font-size: 34px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      color: #666;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      background: #111;
      color: white;
      padding: 14px 28px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 17px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 30px 20px;
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card p {
      color: #666;
      line-height: 1.7;
    }

    footer {
      margin-top: 30px;
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
    }
  </style>
</head>

<body>

  <header>
    <h1>BalBal</h1>
    <p>به وب‌سایت BalBal خوش آمدید</p>
  </header>

  <section class="hero">
    <h2>به BalBal خوش آمدید 👋</h2>
    <p>اینجا شروع پروژه BalBal است.</p>
    <a href="#services" class="button">شروع کنید</a>
  </section>

  <section class="cards" id="services">

    <div class="card">
      <h3>  وزیباساده</h3>
      <p>طراحی ساده، سریع و مناسب موبایل.</p>
    </div>

    <div class="card">
      <h3>🚀 سریع</h3>
      <p>ساخته شده برای عملکرد سریع و روان.</p>
    </div>

    <div class="card">
      <h3>📱 موبایل</h3>
      <p>در گوشی و کامپیوتر به‌خوبی نمایش داده می‌شود.</p>
    </div>

  </section>

  <footer>
    <p>© 2026 BalBal</p>
  </footer>

</body>
</html>
