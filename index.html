<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BalBal | پرداخت USDT</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}
header{
  background:#111;
  color:white;
  text-align:center;
  padding:25px 15px;
}
header h1{margin:0;font-size:32px}
header p{color:#ccc}

.hero{
  background:white;
  text-align:center;
  padding:45px 20px;
}
.hero h2{font-size:30px}
.hero p{font-size:18px;color:#666}

.box{
  max-width:600px;
  margin:30px auto;
  background:white;
  padding:30px;
  border-radius:18px;
  box-shadow:0 3px 20px rgba(0,0,0,.08);
  text-align:center;
}

.qr{
  width:220px;
  height:220px;
  margin:10px auto 25px;
  display:block;
}

.address{
  background:#f1f1f1;
  padding:16px;
  border-radius:12px;
  word-break:break-all;
  direction:ltr;
  font-size:15px;
}

button{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#111;
  color:white;
  font-size:17px;
}

.note{
  margin-top:20px;
  color:#777;
  line-height:1.8;
}

footer{
  margin-top:40px;
  background:#111;
  color:white;
  text-align:center;
  padding:25px;
}
</style>
</head>

<body>

<header>
  <h1>BalBal</h1>
  <p>پرداخت USDT</p>
</header>

<section class="hero">
  <h2>واریز USDT</h2>
  <p>شبکه پرداخت: TRC20</p>
</section>

<div class="box">

  <h2>آدرس کیف پول</h2>

  <img
    class="qr"
    src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=TCSjfwHMZKP3Mcz4vwuWYPUveck9Ecpkik"
    alt="QR Code">

  <div class="address" id="wallet">
    TCSjfwHMZKP3Mcz4vwuWYPUveck9Ecpkik
  </div>

  <button onclick="copyWallet()">
    📋 کپی آدرس کیف پول
  </button>

  <div class="note">
    ⚠️ فقط شبکه <b>TRC20</b> را انتخاب کنید.<br>
    ارسال از شبکه دیگر ممکن است باعث از دست رفتن دارایی شود.
  </div>

</div>

<footer>
  BalBal © 2026
</footer>

<script>
function copyWallet(){
  const address =
    "TCSjfwHMZKP3Mcz4vwuWYPUveck9Ecpkik";

  navigator.clipboard.writeText(address).then(function(){
    alert("آدرس کیف پول کپی شد ✅");
  });
}
</script>

</body>
</html>
